<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<title>护理管理学 · 选择题练习</title>
<style>
  :root{
    --bg:#eef3f9; --card:#ffffff; --ink:#1b2735; --muted:#6b7c92;
    --brand:#1f4e79; --brand2:#2f7ab5; --line:#e2eaf3;
    --green:#178a5e; --green-bg:#e9f7f0; --red:#c9463f; --red-bg:#fdecea;
    --amber:#b7791f; --shadow:0 8px 24px rgba(24,58,92,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 50% -200px, #dcebfa 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:860px;margin:0 auto;padding:18px 16px 130px}
  /* ---------- 首页 ---------- */
  .hero{
    background:linear-gradient(135deg,#173f63 0%,#1f4e79 45%,#2f7ab5 100%);
    color:#fff;border-radius:26px;padding:30px 28px 26px;
    box-shadow:0 18px 40px rgba(23,63,99,.25);position:relative;overflow:hidden;
  }
  .hero:after{
    content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;
    border-radius:50%;background:rgba(255,255,255,.08);
  }
  .hero:before{
    content:"";position:absolute;right:40px;bottom:-90px;width:160px;height:160px;
    border-radius:50%;background:rgba(255,255,255,.06);
  }
  .eyebrow{font-size:12.5px;letter-spacing:.18em;opacity:.75}
  .hero h1{margin:10px 0 2px;font-size:34px;letter-spacing:.04em;font-weight:700}
  .hero .sub{margin:0;font-size:15px;opacity:.9}
  .hero-stats{display:flex;gap:18px;margin-top:20px;font-size:13px;opacity:.92;flex-wrap:wrap}
  .hero-stats b{font-size:20px;margin-right:2px}
  .resume{
    margin-top:16px;background:#fff8e8;border:1px solid #f0dcae;border-radius:14px;
    padding:12px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between;
  }
  .resume small{display:block;color:#8a6a24;font-size:12px;margin-bottom:2px}
  .resume b{font-size:14px}
  .sec-title{margin:26px 4px 12px;font-size:14px;color:var(--muted);letter-spacing:.08em}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mode{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:16px;display:flex;gap:13px;align-items:center;text-align:left;
    box-shadow:0 3px 12px rgba(24,58,92,.04);transition:.18s;width:100%;
  }
  .mode:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#c9dcef}
  .mode .ico{
    width:44px;height:44px;border-radius:14px;flex:0 0 44px;display:grid;place-items:center;
    background:linear-gradient(135deg,#e8f2fc,#d7e9f9);color:var(--brand);font-weight:700;font-size:16px;
  }
  .mode .txt{flex:1;min-width:0}
  .mode .txt b{display:block;font-size:15.5px;line-height:1.3}
  .mode .txt span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
  .mode .num{font-size:12px;color:var(--brand);background:#eaf3fc;border-radius:999px;padding:2px 9px;white-space:nowrap}
  .foot{margin:26px 4px 0;font-size:12px;color:var(--muted);line-height:1.9}
  /* 存档 */
  .arclist{display:flex;flex-direction:column;gap:10px}
  .arc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px}
  .arc-h{display:flex;align-items:baseline;gap:8px}
  .arc-h b{font-size:14.5px}
  .arc-t{margin-left:auto;font-size:11.5px;color:#93a3b7}
  .arc-s{font-size:12.5px;color:var(--muted);margin-top:4px}
  .arc-s b{color:var(--brand);font-size:13.5px}
  .arc-w{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .arc-w>span{font-size:11.5px;color:#9e2f29}
  .chip2{font-size:11px;color:#9e2f29;background:var(--red-bg);border:1px solid #efb6b1;border-radius:6px;padding:1px 6px}
  /* ---------- 顶栏 ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:10px 0;margin-bottom:10px;background:rgba(238,243,249,.86);backdrop-filter:blur(10px);
  }
  .iconbtn{
    width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;
    color:var(--brand);font-size:18px;display:grid;place-items:center;flex:0 0 38px;
  }
  .tb-title{flex:1;min-width:0;font-size:15px;font-weight:600;display:flex;align-items:baseline;gap:8px}
  .tb-title span{font-size:12px;color:var(--muted);font-weight:400}
  .timer{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:6px 10px;border-radius:10px}
  .textbtn{border:0;background:transparent;color:var(--brand);font-size:13px;padding:6px 2px}
  /* ---------- 进度 ---------- */
  .progress{height:7px;background:#dfe9f4;border-radius:99px;overflow:hidden;margin:2px 0 8px}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,#2f7ab5,#1f4e79);border-radius:99px;transition:width .25s}
  .statline{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:0 2px 12px}
  .statline b{color:var(--ink)}
  .statline .ok b{color:var(--green)}
  .statline .no b{color:var(--red)}
  /* ---------- 题目卡 ---------- */
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 20px 18px;box-shadow:var(--shadow)}
  .qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .pill{font-size:11.5px;color:var(--brand);background:#eaf3fc;border-radius:999px;padding:3px 10px;letter-spacing:.03em}
  .pill.gray{color:var(--muted);background:#f2f5f9}
  .qno{margin-left:auto;font-size:12px;color:#93a3b7}
  .stem{font-size:17px;line-height:1.85;letter-spacing:.01em;word-break:break-word}
  .stem sub,.stem sup{font-size:72%}
  .opts{margin-top:16px;display:flex;flex-direction:column;gap:9px}
  .opt{
    width:100%;display:flex;align-items:flex-start;gap:11px;text-align:left;
    background:#fbfdff;border:1.5px solid #e2eaf3;border-radius:13px;padding:11px 13px;
    color:var(--ink);font-size:15px;line-height:1.65;transition:.14s;position:relative;
  }
  .opt:not(:disabled):hover{border-color:#a9c8e6;background:#f5faff}
  .opt .lab{
    flex:0 0 26px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
    background:#eef4fa;color:#5c748e;font-size:12.5px;font-weight:700;margin-top:1px;
  }
  .opt .txt{flex:1;min-width:0;word-break:break-word}
  .opt .tag{font-size:10.5px;border-radius:6px;padding:2px 6px;white-space:nowrap;margin-left:auto;align-self:center}
  .opt.sel{border-color:var(--brand2);background:#eef6ff}
  .opt.sel .lab{background:var(--brand);color:#fff}
  .opt.correct{border-color:#7fc9a8;background:var(--green-bg)}
  .opt.correct .lab{background:var(--green);color:#fff}
  .opt.correct .tag{background:#cdeedd;color:#0f6b49}
  .opt.wrong{border-color:#e8a5a1;background:var(--red-bg)}
  .opt.wrong .lab{background:var(--red);color:#fff}
  .opt.wrong .tag{background:#f8d4d1;color:#9e2f29}
  .opt.dim{opacity:.62}
  .opt:disabled{cursor:default}
  .feedback{margin-top:15px;border-radius:12px;padding:10px 13px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center}
  .feedback.ok{background:var(--green-bg);color:#0f6b49}
  .feedback.no{background:var(--red-bg);color:#9e2f29}
  .feedback .mk{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;line-height:1;flex:0 0 20px}
  .feedback.ok .mk{background:#178a5e}
  .feedback.no .mk{background:#c9463f}
  .exp{margin-top:10px;background:#f7f9fc;border-left:3px solid #a9c8e6;border-radius:0 10px 10px 0;padding:11px 14px;font-size:13.5px;color:#3c4d62;line-height:1.8}
  .exp b{color:var(--brand);font-size:12px;letter-spacing:.08em;display:block;margin-bottom:3px}
  .actions{margin-top:18px;display:flex;gap:10px}
  .btn{border:0;border-radius:12px;padding:11px 18px;font-size:14.5px;font-weight:600;transition:.15s}
  .btn.primary{background:linear-gradient(135deg,#2f7ab5,#1f4e79);color:#fff;flex:1;box-shadow:0 6px 16px rgba(31,78,121,.22)}
  .btn.primary:disabled{background:#c9d6e3;box-shadow:none;cursor:not-allowed}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--brand)}
  .btn.soft{background:#eaf3fc;color:var(--brand)}
  /* ---------- 底部导航 ---------- */
  .navbar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.95);
    border-top:1px solid var(--line);backdrop-filter:blur(10px);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .navbar .inner{max-width:860px;margin:0 auto;display:flex;gap:9px}
  .navbar button{
    flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;
    font-size:13.5px;color:var(--ink);
  }
  .navbar button.mid{flex:0 0 90px;color:var(--brand);background:#f2f8ff}
  .navbar button:disabled{opacity:.4;cursor:not-allowed}
  /* ---------- 答题卡 ---------- */
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(15,32,50,.45);display:flex;align-items:flex-end;justify-content:center;padding:0}
  .sheet{background:#fff;width:100%;max-width:860px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto;animation:up .22s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h3{margin:0 0 4px;font-size:16px}
  .sheet .hint{font-size:12px;color:var(--muted);margin-bottom:14px}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:1px}
  .sheet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
  .sheet-grid button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;color:#51657b}
  .sheet-grid button.ok{background:#dcf2e7;border-color:#a9dcc6;color:#0f6b49}
  .sheet-grid button.no{background:#f9dedb;border-color:#efb6b1;color:#9e2f29}
  .sheet-grid button.sel{background:#dcecff;border-color:#a9c8e6;color:var(--brand)}
  .sheet-grid button.cur{outline:2px solid var(--brand);outline-offset:1px}
  /* ---------- 成绩 ---------- */
  .scorecard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;text-align:center;box-shadow:var(--shadow)}
  .ring{width:150px;height:150px;border-radius:50%;margin:4px auto 16px;display:grid;place-items:center;
    background:conic-gradient(var(--brand) calc(var(--p)*1%), #e4edf7 0)}
  .ring .in{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;flex-direction:column}
  .ring b{font-size:33px;line-height:1;color:var(--brand)}
  .ring small{font-size:11px;color:var(--muted);margin-top:4px}
  .scorecard h2{margin:0 0 4px;font-size:19px}
  .scorecard p{margin:0;color:var(--muted);font-size:13px}
  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
  .stat b{display:block;font-size:20px}
  .stat span{font-size:11.5px;color:var(--muted)}
  .stat.ok b{color:var(--green)} .stat.no b{color:var(--red)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
  .chip{border:1px solid #efb6b1;background:var(--red-bg);color:#9e2f29;border-radius:8px;padding:4px 9px;font-size:12px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
  .card h3{margin:0 0 8px;font-size:14px}
  /* ---------- 提示 ---------- */
  #toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%) translateY(10px);background:rgba(27,39,53,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:60;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:620px){
    .wrap{padding:12px 12px 120px}
    .hero{padding:24px 20px;border-radius:22px}
    .hero h1{font-size:28px}
    .grid{grid-template-columns:1fr}
    .qcard{padding:16px 14px 14px;border-radius:16px}
    .stem{font-size:16px}
    .opt{font-size:14.5px;padding:10px 11px}
    .statgrid{grid-template-columns:repeat(2,1fr)}
  }
</style>
<style>
  /* ---- 新增：卡片进度、错题本 ---- */
  .mode{position:relative;cursor:pointer}
  .mode .txt .sub{display:block;font-size:12px;color:var(--muted);margin-top:3px}
  .mode .right{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:0 0 auto}
  .mode .badge{display:inline-block;min-width:17px;height:17px;line-height:17px;padding:0 5px;border-radius:9px;
    background:rgba(201,70,63,.12);color:#b83a33;font-size:11px;font-style:normal;text-align:center;margin-left:5px;vertical-align:1px}
  .mode .prog{display:block;font-size:11.5px;color:var(--brand);margin-top:4px}
  .mode .prog b{font-size:12.5px}
  .mode .prog.zero{color:#9aa9bb}
  .mode .redo{
    border:1px solid var(--line);background:#fff;color:#8fa1b5;font-size:11px;
    border-radius:8px;padding:2px 9px;line-height:1.6;
  }
  .mode .redo:hover{color:var(--red);border-color:#efb6b1}
  .mode.wrongcard{background:linear-gradient(135deg,#fff6f5,#ffffff);border-color:#f3d3cf}
  .mode.wrongcard .ico{background:linear-gradient(135deg,#fde8e6,#f9d7d3);color:#b83a33}

  .tfhint{background:#fff8e8;border:1px solid #f0dcae;color:#8a6a24;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-top:10px}
  .btn.danger{background:#fff;border:1px solid #efb6b1;color:#b83a33}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 10px}
</style>

</head>
<body>
<div id="app"></div>
<div id="toast"></div>

function keyOf(pid, i){ return pid + ":" + i; }

function sameSet(a,b){
  if(!Array.isArray(a)||!Array.isArray(b)) return false;
  if(a.length!==b.length) return false;
  const A=a.slice().sort(), B=b.slice().sort();
  return A.every((v,i)=>v===B[i]);
}
function inWrongMode(){ return !!(cur && cur.id === "wrong"); }
function getAns(k){
  if(inWrongMode()) return WANS[k] || null;
  return A[k] || null;
}
function setSel(k, sel){
  if(inWrongMode()){
    const a = WANS[k] || {sel:null, ok:null};
    if(a.ok !== null && a.ok !== undefined) return;
    WANS[k] = {sel: sel, ok: null};
    return;
  }
  const a = A[k] || {sel:null, ok:null};
  if(a.ok !== null && a.ok !== undefined) return;
  A[k] = {sel: sel, ok: null};
  wr(K_ANS, A);
}
function setOk(k, ok){
  if(inWrongMode()){
    const a = WANS[k] || {sel:null, ok:null};
    a.ok = ok; WANS[k] = a;
    return;
  }
  const a = A[k] || {sel:null, ok:null};
  a.ok = ok; A[k] = a; wr(K_ANS, A);
}

function addWrong(k){
  if(W.indexOf(k) < 0){ W.unshift(k); wr(K_WRONG, W); }
}
function delWrong(k){
  W = W.filter(x => x !== k); wr(K_WRONG, W);
}

function statsOf(pid){
  const sec = secById(pid);
  const n = sec.items.length;
  let done = 0, right = 0;
  for(let i=0;i<n;i++){
    const a = A[keyOf(pid,i)];
    if(a && a.ok !== null && a.ok !== undefined){ done++; if(a.ok) right++; }
  }
  return { n, done, right, wrong: done-right, acc: done ? Math.round(right/done*100) : 0 };
}

function itemsFor(pid){
  if(pid === "wrong"){
    return W.map(k=>{
      const p = k.slice(0, k.lastIndexOf(":")), i = k.slice(k.lastIndexOf(":")+1);
      const s = secById(p), it = s && s.items[+i];
      return it ? Object.assign({}, it, {key:k, src:s.title}) : null;
    }).filter(Boolean);
  }
  const s = secById(pid);
  return s.items.map((it,i)=> Object.assign({}, it, {key: keyOf(pid,i), src: s.title}));
}

function enter(pid){
  const items = itemsFor(pid);
  if(!items.length){ toast(pid === "wrong" ? "错题本还是空的，先去做题吧" : "该卷暂无题目"); return; }
  if(pid === "wrong") WANS = {};
  cur = { id: pid, title: pid === "wrong" ? "错题本" : secById(pid).title, items };
  if(P[pid] == null) P[pid] = 0;
  if(!ST[pid]) ST[pid] = Date.now();
  P[pid] = Math.max(0, Math.min(P[pid], items.length-1));
  cur.idx = P[pid];
  view = "quiz";
  renderQuiz(); startTimer(); window.scrollTo(0,0);
}

function startTimer(){
  stopTimer();
  timerId = setInterval(()=>{
    const el = document.getElementById("timer");
    if(el && cur && ST[cur.id]) el.textContent = fmtTime((Date.now()-ST[cur.id])/1000);
  }, 1000);
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }

/* ---------------- 首页 ---------------- */
function goHome(){
  stopTimer(); cur = null; view = "home"; renderHome(); window.scrollTo(0,0);
}

function renderHome(){
  const pids = SECTIONS.map(s=>s.id);
  const cards = SECTIONS.map((sec, i)=>{
    const st = statsOf(sec.id);
    const icon = sec.id === "t" ? "教" : ("一二三四五六七八九"[i] || String(i+1));
    const prog = st.done
      ? `<span class="prog">已答 ${st.done}/${st.n} · 正确率 ${st.acc}%${st.done===st.n?" · 已完成":""}</span>`
      : `<span class="prog zero">尚未开始</span>`;
    const redo = st.done ? `<button class="redo" onclick="event.stopPropagation();resetPaper('${sec.id}')">重做</button>` : "";
    return `<div class="mode" role="button" tabindex="0" onclick="enter('${sec.id}')">
      <span class="ico">${icon}</span>
      <span class="txt"><b>${sec.title}</b><span class="sub">${sec.desc || ""}</span>${prog}</span>
      <span class="right"><span class="num">${st.n} 题</span>${redo}</span>
    </div>`;
  }).join("");

  const wrongCard = `<div class="mode wrongcard" role="button" tabindex="0" onclick="enter('wrong')">
      <span class="ico">错</span>
      <span class="txt"><b>错题本${W.length?`<i class="badge">${W.length}</i>`:""}</b>
        <span class="sub">做错的题自动汇总，掌握后可移出</span>
        <span class="prog${W.length?"":" zero"}">${W.length?`共 ${W.length} 题待复习`:"暂无错题"}</span>
      </span>
      <span class="right"><span class="num">${W.length} 题</span></span>
    </div>`;

  $("#app").innerHTML = `<div class="wrap">
    <div class="hero">
      <div class="eyebrow">护理管理学 · 课程复习</div>
      <h1>护理管理学</h1>
      <p class="sub">单选 · 多选 · 判断 · 按题库刷题</p>
      <div class="hero-stats"><span><b>${TOTAL}</b>道题</span><span><b>${SECTIONS.length}</b>个题库</span><span>进度自动保存 · 错题自动汇总</span></div>
    </div>
    <div class="sec-title">开始练习</div>
    <div class="grid">${wrongCard}${cards}</div>
    <p class="foot">说明：每个题库的作答进度会自动保存在本机，返回首页后再点进去仍接着上次；想重来点卡片右下角“重做”。答错的题会自动进入“错题本”，在错题本里点“已掌握，移出”即可移除。</p>
  </div>`;
}

function resetPaper(pid){
  const st = statsOf(pid);
  if(!confirm(`重做「${secById(pid).title}」？\n\n该卷已答 ${st.done}/${st.n} 的记录会清空（错题本中的题目不受影响）。`)) return;
  Object.keys(A).forEach(k=>{ if(k.indexOf(pid+":") === 0) delete A[k]; });
  wr(K_ANS, A);
  delete P[pid]; wr(K_POS, P);
  delete ST[pid]; wr(K_START, ST);
  renderHome();
  toast("已清空该卷记录");
}

/* ---------------- 答题页 ---------------- */
function renderQuiz(){
  const items = cur.items;
  const i = Math.min(cur.idx, items.length-1);
  cur.idx = i;
  P[cur.id] = i; wr(K_POS, P);
  const it = items[i];
  const a = getAns(it.key);
  const answered = !!(a && a.ok !== null && a.ok !== undefined);
  const sel = a ? a.sel : null;

  let done = 0, right = 0;
  items.forEach(x=>{
    const b = getAns(x.key);
    if(b && b.ok !== null && b.ok !== undefined){ done++; if(b.ok) right++; }
  });

  const opts = it.o.map((text,k)=>{
    let cls = "opt", tag = "";
    const isCorrect = it.t === "multi" ? (Array.isArray(it.a) && it.a.indexOf(k) >= 0) : (k === it.a);
    const isPicked = it.t === "multi" ? (Array.isArray(sel) && sel.indexOf(k) >= 0) : (k === sel);
    if(answered){
      if(isCorrect){ cls += " correct"; tag = `<span class="tag">${isPicked?"正确":"正确答案"}</span>`; }
      else if(isPicked){ cls += " wrong"; tag = `<span class="tag">你的选择</span>`; }
      else { cls += " dim"; }
    }else if(isPicked){
      cls += " sel";
    }
    return `<button class="${cls}" onclick="pick(${k})" ${answered?"disabled":""}>
      <span class="lab">${it.t === "tf" ? (k===0?"√":"×") : LETTERS[k]}</span>
      <span class="txt">${text}</span>${tag}
    </button>`;
  }).join("");

  let feedback = "";
  if(answered){
    const ok = a.ok === true;
    feedback = `<div class="feedback ${ok?"ok":"no"}">
      <span class="mk">${ok?"✓":"✕"}</span>
      <span>${ok?"回答正确":"回答错误"}${ok?"":`，正确答案：${answerText(it, it.a)}`}</span>
    </div>
    ${it.e ? `<div class="exp"><b>解 析</b><p style="margin:0">${it.e}</p></div>` : ""}`;
  }

  const isWrongMode = cur.id === "wrong";
  const inWrongList = W.indexOf(it.key) >= 0;

  let wrongBar = "";
  if(isWrongMode){
    wrongBar = `<div class="tfhint">这道题来自「${it.src}」。
      <button class="btn danger" style="padding:6px 12px;font-size:12.5px;margin-left:8px" onclick="removeCurrent()">已掌握，移出</button>
    </div>`;
  }else if(answered && a.ok === false && inWrongList){
    wrongBar = `<div class="tfhint">已加入错题本，可在首页「错题本」里复习。</div>`;
  }

  const action = answered
    ? `<button class="btn primary" onclick="nextFromCard()">${i === items.length-1 ? (isWrongMode ? "完成本组" : "查看本次成绩") : "下一题 →"}</button>`
    : `<button class="btn primary" onclick="submitCurrent()" ${sel===null||sel===undefined||(Array.isArray(sel)&&sel.length===0)?"disabled":""}>提交本题</button>`;

  $("#app").innerHTML = `<div class="wrap">
    <div class="topbar">
      <button class="iconbtn" onclick="goHome()" aria-label="返回">←</button>
      <div class="tb-title">${cur.title}<span>${i+1} / ${items.length}</span></div>
      <div class="timer" id="timer">${fmtTime((Date.now()-(ST[cur.id]||Date.now()))/1000)}</div>
      <button class="textbtn" onclick="finishNow()">结束</button>
    </div>
    <div class="progress"><i style="width:${Math.round(done/items.length*100)}%"></i></div>
    <div class="statline"><span>已答 <b>${done}</b></span><span class="ok">正确 <b>${right}</b></span><span class="no">错误 <b>${done-right}</b></span><span style="margin-left:auto">自动保存</span></div>

    <div class="qcard" id="qcard">
      <div class="qmeta">
        <span class="pill">${it.t === "tf" ? "判断题" : (it.t === "multi" ? "多选题" : "单选题")}</span>
        <span class="pill gray">${it.src}</span>
        <span class="qno">第 ${i+1} 题</span>
      </div>
      <div class="stem">${it.q}</div>
      <div class="opts">${opts}</div>
      ${feedback}
      ${wrongBar}
      <div class="actions">${action}</div>
    </div>
  </div>
  <div class="navbar"><div class="inner">
    <button onclick="prevQ()" ${i===0?"disabled":""}>← 上一题</button>
    <button class="mid" onclick="openSheet()">答题卡</button>
    <button onclick="nextQ()" ${i===items.length-1?"disabled":""}>下一题 →</button>
  </div></div>`;
}

function answerText(it, v){
  if(v === null || v === undefined) return "未答";
  if(it.t === "multi") return (Array.isArray(v) ? v : []).map(i=>LETTERS[i]).join("") || "未答";
  return it.t === "tf" ? it.o[v] : LETTERS[v];
}

function pick(k){
  if(!cur) return;
  const it = cur.items[cur.idx];
  const a = getAns(it.key);
  if(a && a.ok !== null && a.ok !== undefined) return;
  if(it.t === "multi"){
    const arr = (a && Array.isArray(a.sel)) ? a.sel.slice() : [];
    const pos = arr.indexOf(k);
    if(pos >= 0) arr.splice(pos,1); else arr.push(k);
    arr.sort((x,y)=>x-y);
    setSel(it.key, arr);
  } else {
    setSel(it.key, k);
  }
  const y = window.scrollY;
  renderQuiz();
  window.scrollTo(0, y);
}

function submitCurrent(){
  const it = cur.items[cur.idx];
  const a = getAns(it.key);
  if(!a || a.sel === null || a.sel === undefined){ toast("请先选择一个选项"); return; }
  if(a.ok !== null && a.ok !== undefined) return;
  const ok = it.t === "multi" ? sameSet(a.sel, it.a) : (a.sel === it.a);
  setOk(it.key, ok);
  if(!ok && cur.id !== "wrong") addWrong(it.key);
  renderQuiz();
  const card = document.getElementById("qcard");
  if(card){
    const top = card.getBoundingClientRect().top + window.scrollY - 70;
    window.scrollTo({top, behavior:"smooth"});
  }
  if(ok && cur.id === "wrong") toast("答对了，可以点“已掌握，移出”");
}

function removeCurrent(){
  const it = cur.items[cur.idx];
  delete WANS[it.key];
  delWrong(it.key);
  toast("已移出错题本");
  const left = W.length;
  if(!left){ goHome(); return; }
  const idx = cur.idx;
  cur.items = itemsFor("wrong");
  cur.idx = Math.min(idx, cur.items.length-1);
  renderQuiz();
}

function nextFromCard(){
  if(cur.idx === cur.items.length-1){
    if(cur.id === "wrong"){ renderWrongDone(); return; }
    renderSummary(); return;
  }
  nextQ();
}
function nextQ(){
  if(cur.idx < cur.items.length-1){ cur.idx++; P[cur.id]=cur.idx; wr(K_POS,P); renderQuiz(); window.scrollTo({top:0,behavior:"smooth"}); }
}
function prevQ(){
  if(cur.idx > 0){ cur.idx--; P[cur.id]=cur.idx; wr(K_POS,P); renderQuiz(); window.scrollTo({top:0,behavior:"smooth"}); }
}
function finishNow(){
  if(cur && cur.id === "wrong"){ renderWrongDone(); return; }
  let done = 0;
  cur.items.forEach(x=>{ const b=getAns(x.key); if(b && b.ok!==null && b.ok!==undefined) done++; });
  if(!done){ toast("还没有作答任何题目"); return; }
  if(confirm(`已完成 ${done} 题，查看本次成绩？`)) renderSummary();
}

/* ---------------- 答题卡 ---------------- */
function openSheet(){
  const cells = cur.items.map((it,k)=>{
    const a = getAns(it.key);
    const answered = !!(a && a.ok !== null && a.ok !== undefined);
    let cls = "";
    if(answered) cls = a.ok ? "ok" : "no";
    else if(a && a.sel !== null) cls = "sel";
    if(k === cur.idx) cls += " cur";
    return `<button class="${cls}" onclick="jumpTo(${k})">${k+1}</button>`;
  }).join("");
  const done = cur.items.filter(x=>{const b=getAns(x.key); return b && b.ok!==null && b.ok!==undefined;}).length;
  const wrap = document.createElement("div");
  wrap.className = "overlay"; wrap.id = "sheetOverlay";
  wrap.onclick = e => { if(e.target === wrap) closeSheet(); };
  wrap.innerHTML = `<div class="sheet">
    <h3>答题卡</h3>
    <div class="hint">${cur.title} · 已答 ${done}/${cur.items.length}</div>
    <div class="legend">
      <span><i style="background:#178a5e"></i>答对</span>
      <span><i style="background:#c9463f"></i>答错</span>
      <span><i style="background:#2f7ab5"></i>已选未提交</span>
      <span><i style="background:#e2eaf3"></i>未答</span>
    </div>
    <div class="sheet-grid">${cells}</div>
    <div style="height:14px"></div>
    <button class="btn ghost" style="width:100%" onclick="closeSheet()">关闭</button>
  </div>`;
  document.body.appendChild(wrap);
}
function closeSheet(){ const el = document.getElementById("sheetOverlay"); if(el) el.remove(); }
function jumpTo(k){ cur.idx = k; P[cur.id]=k; wr(K_POS,P); closeSheet(); renderQuiz(); window.scrollTo(0,0); }

/* ---------------- 成绩 ---------------- */
function renderSummary(){
  stopTimer(); view = "summary";
  const items = cur.items;
  let done=0, right=0; const wrongs=[];
  items.forEach((x,k)=>{
    const b = getAns(x.key);
    if(b && b.ok !== null && b.ok !== undefined){ done++; if(b.ok) right++; else wrongs.push(k); }
  });
  const rate = done ? Math.round(right/done*100) : 0;
  const secs = Math.floor((Date.now() - (ST[cur.id] || Date.now()))/1000);
  const chips = wrongs.slice(0,80).map(k=>`<button class="chip" onclick="jumpFromSummary(${k})">第 ${k+1} 题</button>`).join("");

  $("#app").innerHTML = `<div class="wrap">
    <div class="topbar">
      <button class="iconbtn" onclick="goHome()" aria-label="首页">←</button>
      <div class="tb-title">本次成绩</div>
      <div class="timer">${fmtTime(secs)}</div>
    </div>
    <div class="scorecard">
      <div class="ring" style="--p:${rate}"><div class="in"><b>${rate}%</b><small>正确率</small></div></div>
      <h2>${cur.title} 已完成</h2>
      <p>已答 ${done} / ${items.length} · 用时 ${fmtTime(secs)}</p>
    </div>
    <div class="statgrid">
      <div class="stat"><b>${done}</b><span>已答</span></div>
      <div class="stat ok"><b>${right}</b><span>正确</span></div>
      <div class="stat no"><b>${done-right}</b><span>错误</span></div>
      <div class="stat"><b>${items.length-done}</b><span>未答</span></div>
    </div>
    ${wrongs.length ? `<div class="card"><h3>本卷错题（点击回看解析）</h3><div class="chips">${chips}</div></div>`
                    : `<div class="card"><h3>没有错题，继续保持</h3></div>`}
    <div class="card" style="display:flex;gap:10px;flex-wrap:wrap">
      ${wrongs.length ? `<button class="btn primary" style="flex:1;min-width:140px" onclick="jumpFromSummary(${wrongs[0]})">逐题看错题</button>` : ""}
      <button class="btn ghost" style="flex:1;min-width:120px" onclick="goHome()">返回首页</button>
    </div>
  </div>`;
  window.scrollTo(0,0);
}
function jumpFromSummary(k){
  cur.idx = k; P[cur.id]=k; wr(K_POS,P);
  view = "quiz"; renderQuiz(); startTimer(); window.scrollTo(0,0);
}

function renderWrongDone(){
  stopTimer(); view = "wrongdone";
  const items = cur.items;
  let done = 0, right = 0;
  items.forEach(x=>{ const b = getAns(x.key); if(b && b.ok!==null && b.ok!==undefined){ done++; if(b.ok) right++; } });
  const left = W.length;
  const wrongLeft = items.filter(x=>{const b=getAns(x.key); return b && b.ok===false;}).length;
  $("#app").innerHTML = `<div class="wrap">
    <div class="topbar">
      <button class="iconbtn" onclick="goHome()" aria-label="首页">←</button>
      <div class="tb-title">错题本</div>
    </div>
    <div class="scorecard">
      <div class="ring" style="--p:${done?Math.round(right/done*100):0}"><div class="in"><b>${done?Math.round(right/done*100):0}%</b><small>本组正确率</small></div></div>
      <h2>这组错题已过完</h2>
      <p>本组 ${items.length} 题 · 答对 ${right} 题 · 答错 ${wrongLeft} 题</p>
    </div>
    <div class="statgrid">
      <div class="stat"><b>${items.length}</b><span>本组题数</span></div>
      <div class="stat ok"><b>${right}</b><span>答对</span></div>
      <div class="stat no"><b>${wrongLeft}</b><span>仍答错</span></div>
      <div class="stat"><b>${left}</b><span>错题本剩余</span></div>
    </div>
    <div class="card" style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn primary" style="flex:1;min-width:140px" onclick="enter('wrong')">再刷一遍</button>
      <button class="btn ghost" style="flex:1;min-width:120px" onclick="goHome()">返回首页</button>
    </div>
    <p class="foot">觉得哪道已经掌握了，回到题目里点“已掌握，移出”即可。</p>
  </div>`;
  window.scrollTo(0,0);
}

/* ---------------- 键盘 ---------------- */
document.addEventListener("keydown", e=>{
  if(!cur || view !== "quiz") return;
  if(document.getElementById("sheetOverlay")) return;
  const k = e.key.toUpperCase();
  if(LETTERS.includes(k) && k.length === 1){
    const idx = LETTERS.indexOf(k);
    if(idx < cur.items[cur.idx].o.length){ pick(idx); e.preventDefault(); }
  }else if(/^[1-5]$/.test(e.key)){
    const idx = Number(e.key)-1;
    if(idx < cur.items[cur.idx].o.length){ pick(idx); e.preventDefault(); }
  }else if(e.key === "Enter"){
    const a = getAns(cur.items[cur.idx].key);
    if(!a || a.ok === null) submitCurrent(); else nextFromCard();
  }else if(e.key === "ArrowRight"){ nextQ(); }
  else if(e.key === "ArrowLeft"){ prevQ(); }
});

renderHome();

</script>
</body>
</html>
